# Same project name as cheles-backend, so api, db and web are grouped together
name: cheles

services:
  web:
    build:
      context: .
      args:
        API_URL: ${API_URL:-http://api:8000}
    image: cheles-web
    restart: unless-stopped
    ports:
      # Only reachable from this Mac
      - "127.0.0.1:3000:3000"
    networks: [cheles-net]

networks:
  # Created by the cheles-backend compose file (start the backend first)
  cheles-net:
    external: true
