name: cheles-web

services:
  web:
    build:
      context: .
      args:
        API_URL: ${API_URL:-http://api:8000}
    restart: unless-stopped
    ports:
      # Solo accesible desde este Mac
      - "127.0.0.1:3000:3000"
    networks: [cheles-net]

networks:
  # Creada por el compose de cheles-backend (arrancar primero el backend)
  cheles-net:
    external: true
