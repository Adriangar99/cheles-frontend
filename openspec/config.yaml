schema: spec-driven

context: |
  Cheles: personal web app to view the user's own bank accounts (BBVA, Revolut…) through
  Enable Banking. Single user, only reachable from their Mac.
  This repo is the frontend only: mobile-first Next.js, Docker Compose. The API lives in the
  cheles-backend repo and is reached over the external Docker network `cheles-net` (/api/* rewrite).

  Language:
  - Write every artifact (proposal, specs, design, tasks), all documentation and all code
    (identifiers, comments, commit messages) in English.
  - The app's user-facing copy is Spanish (Spain). Quote current user-facing literals verbatim.

  Constraints that cannot be inferred from the code:
  - Security: the web app only listens on 127.0.0.1, the API is never published, session via
    HttpOnly cookie, login with password + TOTP and a per-IP attempt limit.
  - Never commit or print `.env` or `secrets/` (Enable Banking private keys).
  - Transactions are stored exactly as the bank returns them (`raw`) so they can be reprocessed
    without fetching again; categorization/stats changes must derive from `raw`.
  - Transfers between the user's own accounts (detected by IBAN) count as neither expense nor
    income. Account roles: main (day to day), savings, excluded.

  Architecture (lightweight, feature-based; incremental migration in progress):
  - src/app/ only holds thin Next.js routes that compose features.
  - src/features/<feature>/ (auth, stats, transactions, banks): domain/ (pure, no React or fetch),
    api.ts (adapter behind an interface/port), TanStack Query hooks and components/.
    A feature never imports another feature's internals; shared code goes in src/shared/.
  - API types are generated with openapi-typescript from the openapi.json versioned in
    cheles-backend; they are never written by hand.
  - TDD: Vitest + Testing Library; hook and component tests use a fake adapter for the API
    port (no MSW). Lint and formatting with Biome.

rules:
  proposal:
    - Always state what is out of scope
    - Flag whether the change touches the security surface (auth, port exposure, secrets)
    - State which features are affected and whether it depends on an API change in cheles-backend
  specs:
    - One capability per screen or user flow, named in kebab-case
    - WHEN/THEN scenarios verifiable from the user's point of view
  design:
    - Place every new piece in its feature and layer (domain, api, hooks, components)
  tasks:
    - "Follow TDD: every behavior task starts by writing the failing test"
    - Include a verification task with `docker compose up -d --build`
